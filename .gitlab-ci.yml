stages:
  - security
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose --redact

sast_scan:
  stage: security
  image: semgrep/semgrep

  script:
    - mkdir -p security-reports
    - semgrep scan --config auto --json --output security-reports/semgrep-results.json application/
    - python scripts/security_report.py --scanner semgrep --input security-reports/semgrep-results.json

  artifacts:
    when: always
    paths:
      - security-reports/semgrep-results.json
    expire_in: 7 days

unit_tests:
  stage: test
  image: python:3.10-slim

  before_script:
    - python --version
    - python -m pip install -r requirements-dev.txt

  script:
    - python -m pytest -v