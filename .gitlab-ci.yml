stages:
  - security
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

secret_scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - gitleaks detect --source . --config .gitleaks.toml --verbose --redact

unit_tests:
  stage: test
  image: python:3.10-slim

  before_script:
    - python --version
    - python -m pip install -r requirements-dev.txt

  script:
    - python -m pytest -v